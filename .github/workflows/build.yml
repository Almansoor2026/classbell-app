name: Build ClassBell APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Capacitor project
        run: |
          cat > package.json <<'EOF'
          {
            "name": "classbell",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "6.1.2",
              "@capacitor/core": "6.1.2",
              "@capacitor/local-notifications": "6.1.0"
            },
            "devDependencies": {
              "@capacitor/cli": "6.1.2"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.classbell.app",
            "appName": "ClassBell",
            "webDir": "www"
          }
          EOF
          npm install
      - name: Prepare web files
        run: |
          mkdir www
          # Your phone may name uploads "index (2).html" etc. Use whichever index file was uploaded most recently.
          newest=$(for f in index*.html; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -1 | cut -d' ' -f2-)
          echo "Using page file: $newest"
          cp "$newest" www/index.html
          cp app.js sw.js manifest.json www/
          curl -sSL https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js -o www/supabase.js
          sed -i 's#https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js#supabase.js#' www/index.html
          grep -c 'src="supabase.js"' www/index.html
      - name: Add Android and native alarm code
        run: |
          npx cap add android
          npx cap sync android
          D=android/app/src/main/java/com/classbell/app
          cat > $D/MainActivity.java <<'EOF'
          package com.classbell.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(AlarmPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF
          cat > $D/AlarmPlugin.java <<'EOF'
          package com.classbell.app;

          import android.content.Context;
          import androidx.biometric.BiometricManager;
          import androidx.biometric.BiometricPrompt;
          import java.util.concurrent.Executor;
          import android.content.Intent;
          import android.os.Build;
          import android.os.PowerManager;
          import android.provider.Settings;
          import androidx.core.app.NotificationManagerCompat;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import androidx.activity.result.ActivityResult;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "ClassAlarm")
          public class AlarmPlugin extends Plugin {
            @PluginMethod
            public void schedule(PluginCall call) {
              Context c = getContext();
              JSArray items = call.getArray("items");
              c.getSharedPreferences(Scheduler.PREFS, 0).edit()
                .putString("items", items == null ? "[]" : items.toString())
                .putInt("snooze", call.getInt("snooze", 5))
                .putBoolean("flash", call.getBoolean("flash", true))
                .apply();
              int n = Scheduler.scheduleAll(c);
              JSObject o = new JSObject();
              o.put("count", n);
              call.resolve(o);
            }

            // Rings right now so the teacher can check sound, flashlight and notification.
            @PluginMethod
            public void test(PluginCall call) {
              Context c = getContext();
              c.getSharedPreferences(Scheduler.PREFS, 0).edit().putBoolean("flash", call.getBoolean("flash", true)).apply();
              Intent s = new Intent(c, RingService.class).putExtra("title", "Test alarm").putExtra("body", "ClassBell alarm is working");
              ContextCompat.startForegroundService(c, s);
              call.resolve();
            }

            // Reports whether the phone is likely to let alarms through.
            @PluginMethod
            public void status(PluginCall call) {
              Context c = getContext();
              JSObject o = new JSObject();
              boolean battery = true;
              try {
                if (Build.VERSION.SDK_INT >= 23) {
                  PowerManager pm = (PowerManager) c.getSystemService(Context.POWER_SERVICE);
                  battery = pm.isIgnoringBatteryOptimizations(c.getPackageName());
                }
              } catch (Exception e) { }
              o.put("battery", battery);
              o.put("notifications", NotificationManagerCompat.from(c).areNotificationsEnabled());
              o.put("next", c.getSharedPreferences(Scheduler.PREFS, 0).getLong("next", 0L));
              o.put("count", c.getSharedPreferences(Scheduler.PREFS, 0).getInt("n", 0));
              call.resolve(o);
            }

            // Asks Android to stop limiting this app in the background.
            @PluginMethod
            public void fixBattery(PluginCall call) {
              Context c = getContext();
              Uri pkg = Uri.parse("package:" + c.getPackageName());
              try {
                Intent i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, pkg);
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                c.startActivity(i);
              } catch (Exception e) {
                try {
                  Intent i = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, pkg);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  c.startActivity(i);
                } catch (Exception e2) { }
              }
              call.resolve();
            }

            // Fingerprint (or phone PIN) check used to open the app.
            @PluginMethod
            public void authenticate(final PluginCall call) {
              final androidx.fragment.app.FragmentActivity act = getActivity();
              act.runOnUiThread(new Runnable() {
                public void run() {
                  try {
                    int allowed = BiometricManager.Authenticators.BIOMETRIC_WEAK | BiometricManager.Authenticators.DEVICE_CREDENTIAL;
                    if (BiometricManager.from(act).canAuthenticate(allowed) != BiometricManager.BIOMETRIC_SUCCESS) {
                      JSObject o = new JSObject();
                      o.put("ok", true);
                      o.put("skipped", true);
                      call.resolve(o);
                      return;
                    }
                    Executor ex = ContextCompat.getMainExecutor(act);
                    BiometricPrompt bp = new BiometricPrompt(act, ex, new BiometricPrompt.AuthenticationCallback() {
                      @Override
                      public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult r) {
                        JSObject o = new JSObject();
                        o.put("ok", true);
                        call.resolve(o);
                      }
                      @Override
                      public void onAuthenticationError(int code, CharSequence msg) {
                        JSObject o = new JSObject();
                        o.put("ok", false);
                        call.resolve(o);
                      }
                    });
                    BiometricPrompt.PromptInfo info = new BiometricPrompt.PromptInfo.Builder()
                      .setTitle("Unlock ClassBell")
                      .setSubtitle("Use your fingerprint or phone PIN")
                      .setAllowedAuthenticators(allowed)
                      .build();
                    bp.authenticate(info);
                  } catch (Exception e) {
                    JSObject o = new JSObject();
                    o.put("ok", true);
                    o.put("skipped", true);
                    call.resolve(o);
                  }
                }
              });
            }

            // Opens the phone's own ringtone list.
            @PluginMethod
            public void pickTone(PluginCall call) {
              Intent i = new Intent(RingtoneManager.ACTION_RINGTONE_PICKER);
              i.putExtra(RingtoneManager.EXTRA_RINGTONE_TYPE, RingtoneManager.TYPE_ALARM | RingtoneManager.TYPE_RINGTONE);
              i.putExtra(RingtoneManager.EXTRA_RINGTONE_SHOW_DEFAULT, true);
              i.putExtra(RingtoneManager.EXTRA_RINGTONE_SHOW_SILENT, false);
              i.putExtra(RingtoneManager.EXTRA_RINGTONE_TITLE, "Choose class alarm sound");
              startActivityForResult(call, i, "toneResult");
            }

            @ActivityCallback
            private void toneResult(PluginCall call, ActivityResult result) {
              if (call == null) return;
              Intent d = result.getData();
              Uri u = d != null ? (Uri) d.getParcelableExtra(RingtoneManager.EXTRA_RINGTONE_PICKED_URI) : null;
              Context c = getContext();
              String name = "Phone default";
              if (u != null) {
                c.getSharedPreferences(Scheduler.PREFS, 0).edit().putString("tone", u.toString()).apply();
                try { name = RingtoneManager.getRingtone(c, u).getTitle(c); } catch (Exception e) { }
              }
              JSObject o = new JSObject();
              o.put("name", name);
              call.resolve(o);
            }
          }
          EOF
          cat > $D/Scheduler.java <<'EOF'
          package com.classbell.app;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import java.util.Calendar;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class Scheduler {
            static final String PREFS = "classbell";

            static PendingIntent pi(Context c, int id, String title, String body) {
              Intent i = new Intent(c, AlarmReceiver.class).setAction("com.classbell.RING")
                .putExtra("title", title).putExtra("body", body);
              return PendingIntent.getBroadcast(c, id, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
            }

            static void set(Context c, long when, int id, String title, String body) {
              AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
              PendingIntent show = PendingIntent.getActivity(c, 0, new Intent(c, MainActivity.class), PendingIntent.FLAG_IMMUTABLE);
              am.setAlarmClock(new AlarmManager.AlarmClockInfo(when, show), pi(c, id, title, body));
            }

            // Sets the next occurrence of every saved class alarm. Returns how many were set (-1 if the phone refused).
            static int scheduleAll(Context c) {
              int count = 0;
              try {
                SharedPreferences p = c.getSharedPreferences(PREFS, 0);
                AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                int oldN = p.getInt("n", 0);
                for (int k = 1; k <= oldN; k++) am.cancel(pi(c, k, "", ""));
                JSONArray a = new JSONArray(p.getString("items", "[]"));
                long nextMin = Long.MAX_VALUE;
                for (int k = 0; k < a.length(); k++) {
                  JSONObject o = a.getJSONObject(k);
                  Calendar t = Calendar.getInstance();
                  t.set(Calendar.SECOND, 0);
                  t.set(Calendar.MILLISECOND, 0);
                  t.set(Calendar.DAY_OF_WEEK, o.getInt("day") % 7 + 1);
                  t.set(Calendar.HOUR_OF_DAY, o.getInt("hour"));
                  t.set(Calendar.MINUTE, o.getInt("minute"));
                  if (t.getTimeInMillis() <= System.currentTimeMillis() + 1000) t.add(Calendar.DAY_OF_YEAR, 7);
                  long tm = t.getTimeInMillis();
                  if (tm < nextMin) nextMin = tm;
                  set(c, tm, k + 1, o.optString("title"), o.optString("body"));
                  count++;
                }
                p.edit().putInt("n", a.length()).putLong("next", count == 0 ? 0L : nextMin).apply();
                return count;
              } catch (Exception e) {
                return -1;
              }
            }
          }
          EOF
          cat > $D/AlarmReceiver.java <<'EOF'
          package com.classbell.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import androidx.core.app.NotificationCompat;
          import androidx.core.content.ContextCompat;

          public class AlarmReceiver extends BroadcastReceiver {
            @Override
            public void onReceive(Context c, Intent i) {
              String a = i.getAction() == null ? "" : i.getAction();
              if (a.equals(Intent.ACTION_BOOT_COMPLETED) || a.equals(Intent.ACTION_MY_PACKAGE_REPLACED)
                  || a.equals(Intent.ACTION_TIME_CHANGED) || a.equals(Intent.ACTION_TIMEZONE_CHANGED)) {
                Scheduler.scheduleAll(c);
                return;
              }
              if (a.equals("com.classbell.STOP")) { c.stopService(new Intent(c, RingService.class)); return; }
              if (a.equals("com.classbell.SNOOZE")) {
                c.stopService(new Intent(c, RingService.class));
                int m = c.getSharedPreferences(Scheduler.PREFS, 0).getInt("snooze", 5);
                Scheduler.set(c, System.currentTimeMillis() + m * 60000L, 9000, i.getStringExtra("title"), i.getStringExtra("body"));
                return;
              }
              String title = i.getStringExtra("title") == null ? "Class time" : i.getStringExtra("title");
              String body = i.getStringExtra("body") == null ? "" : i.getStringExtra("body");
              // Line up next week's alarm first, so it is set even if ringing fails.
              Scheduler.scheduleAll(c);
              try {
                Intent s = new Intent(c, RingService.class).putExtra("title", title).putExtra("body", body);
                ContextCompat.startForegroundService(c, s);
              } catch (Exception e) {
                fallback(c, title, body);
              }
            }

            // Backup: a loud alarm-sound notification, used if the phone will not let the ringing service start.
            static void fallback(Context c, String title, String body) {
              try {
                NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                Uri tone = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM);
                long[] pat = {0, 700, 400, 700, 400, 700};
                if (Build.VERSION.SDK_INT >= 26) {
                  NotificationChannel ch = new NotificationChannel("class_backup", "Class alarm (backup)", NotificationManager.IMPORTANCE_HIGH);
                  ch.setSound(tone, new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_ALARM)
                    .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build());
                  ch.enableVibration(true);
                  ch.setVibrationPattern(pat);
                  nm.createNotificationChannel(ch);
                }
                PendingIntent open = PendingIntent.getActivity(c, 1, new Intent(c, MainActivity.class), PendingIntent.FLAG_IMMUTABLE);
                Notification n = new NotificationCompat.Builder(c, "class_backup")
                  .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                  .setContentTitle(title).setContentText(body)
                  .setPriority(NotificationCompat.PRIORITY_MAX).setCategory(NotificationCompat.CATEGORY_ALARM)
                  .setSound(tone).setVibrate(pat).setAutoCancel(true)
                  .setContentIntent(open).setFullScreenIntent(open, true).build();
                nm.notify((int) (System.currentTimeMillis() % 100000) + 100, n);
              } catch (Exception e) { }
            }
          }
          EOF
          cat > $D/RingService.java <<'EOF'
